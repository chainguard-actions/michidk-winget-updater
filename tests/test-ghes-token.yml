name: Test ghes-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ghes-token input
        id: action
        uses: .
        with:
          komac-token: ${{ github.token }}
          identifier: Microsoft.PowerShell
          repo: PowerShell/PowerShell
          url: https://github.com/PowerShell/PowerShell/releases/download/v{VERSION}/PowerShell-{VERSION}-win-x64.msi
          version: "7.4.0"
          ghes-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with ghes-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the Komac submission step
          # (cannot actually submit to winget-pkgs in CI), but it must
          # have accepted the ghes-token input without an input
          # validation error. A failure at the Komac step is acceptable.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with ghes-token input (outcome=$OUTCOME)"
