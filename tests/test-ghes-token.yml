name: Test ghes-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass ghes-token to verify the input is accepted.
      # The action will fail at the package-existence check (invalid identifier),
      # which is expected — we just need to confirm the input is wired through.
      - name: Run action with ghes-token (expect failure at package check)
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: "fake-token-for-testing"
          identifier: "ThisPackage.DoesNotExistInWingetPkgs.XYZ123"
          repo: "microsoft/winget-pkgs"
          url: "https://example.com/release/{VERSION}.zip"
          version: "1.0.0"
          ghes-token: "fake-ghes-token-for-testing"

      - name: Assert action failed (package does not exist)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent package, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent package with ghes-token set"
