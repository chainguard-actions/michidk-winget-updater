name: Test ghes-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: ${{ github.token }}
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: "https://github.com/microsoft/vscode/releases/download/{VERSION}/VSCodeSetup-x64-{VERSION}.exe"
          ghes-token: ${{ github.token }}

      - name: Assert action ran with ghes-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the Run Komac step (no valid token for submission)
          # but it must have accepted the ghes-token input without crashing on it.
          # Both 'success' and 'failure' are acceptable — what matters is the input was accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ghes-token input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
