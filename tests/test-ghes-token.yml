name: Test ghes-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ghes-token input
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: ${{ github.token }}
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: "https://github.com/microsoft/vscode/releases/download/v{VERSION}/VSCodeSetup-x64-{VERSION}.exe"
          version: "1.85.0"
          ghes-token: ${{ github.token }}

      - name: Assert action ran with ghes-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the Komac/submit step since we don't
          # have a real winget-pkgs submission token. What matters is that the
          # ghes-token input was accepted and passed through to the release detection
          # step without causing an input validation error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ghes-token input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
