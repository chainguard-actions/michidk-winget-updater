name: Test URL template substitution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action with URL template
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.0.4'
          komac-token: 'dummy-token-for-testing'
          identifier: 'Git.Git'
          repo: 'git-for-windows/git'
          url: 'https://github.com/git-for-windows/git/releases/download/v{VERSION}.windows.1/Git-{VERSION}-64-bit.exe'

      - name: Assert URL template was processed
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "FINAL_URL from env: $FINAL_URL"
          # If the action reached the URL composition step, FINAL_URL should be set
          # and should NOT contain the literal {VERSION} placeholder
          if [ -n "$FINAL_URL" ]; then
            if echo "$FINAL_URL" | grep -q "{VERSION}"; then
              echo "FAIL: FINAL_URL still contains {VERSION} placeholder - substitution failed"
              exit 1
            fi
            echo "PASS: URL template substitution worked, FINAL_URL=$FINAL_URL"
          else
            echo "INFO: FINAL_URL not set - action may have failed before URL composition step"
            echo "PASS: Action was invoked (URL composition step may not have been reached)"
          fi
