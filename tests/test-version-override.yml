name: Test version override with known package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a well-known package that exists in winget-pkgs.
      # The action will pass the package-existence check and URL composition,
      # then fail at the Komac submission step (no real token / dry-run).
      # We verify the action fails (not at the package-check step) and that
      # the version override is accepted without error up to that point.
      - name: Run action with version override (expect failure at Komac step)
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: "fake-token-for-testing"
          identifier: "Microsoft.VisualStudioCode"
          repo: "microsoft/vscode"
          url: "https://example.com/release/{VERSION}/VSCodeSetup.exe"
          version: "1.85.0"

      - name: Assert action ran (failed at Komac, not at package-check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (Komac will fail with a fake token),
          # but it should NOT succeed (we have no real submission capability).
          # The important thing is it didn't fail at the package-existence check.
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded - Komac may have been skipped"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (likely at Komac step with fake token)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
