name: Test basic usage - known package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.3.0'
          komac-token: ${{ github.token }}
          identifier: 'Microsoft.VisualStudioCode'
          repo: 'microsoft/vscode'
          url: 'https://update.code.visualstudio.com/{VERSION}/win32-x64-user/stable'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (completed or failed gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail at Komac submission (no real submit token),
          # but it should not fail at the package-existence or release-detection steps.
          # Since Komac step has continue-on-error: true, the action itself should succeed
          # or fail only at the Komac step. We accept both success and failure here
          # because in act environment network calls may not work.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
