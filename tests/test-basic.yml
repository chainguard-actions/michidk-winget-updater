name: Test basic usage - valid package and repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.0.4'
          komac-token: ${{ github.token }}
          identifier: 'Microsoft.VisualStudioCode'
          repo: 'microsoft/vscode'
          url: 'https://update.code.visualstudio.com/{VERSION}/win32-x64-user/stable'

      - name: Assert FINAL_URL is set and contains a version
        run: |
          echo "FINAL_URL: $FINAL_URL"
          if [ -z "$FINAL_URL" ]; then
            echo "FAIL: FINAL_URL env var was not set"
            exit 1
          fi
          # Should not contain the literal {VERSION} placeholder
          if echo "$FINAL_URL" | grep -q '{VERSION}'; then
            echo "FAIL: FINAL_URL still contains {VERSION} placeholder: $FINAL_URL"
            exit 1
          fi
          # Should be a valid https URL
          if ! echo "$FINAL_URL" | grep -q '^https://'; then
            echo "FAIL: FINAL_URL does not start with https://: $FINAL_URL"
            exit 1
          fi
          echo "PASS: FINAL_URL=$FINAL_URL"
