name: Test basic usage - URL composition with version placeholder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.6.0'
          # Use a placeholder token - the action will fail at komac step but
          # we want to verify the URL composition and version detection steps
          komac-token: 'placeholder-token'
          # Microsoft.PowerShell is a well-known package in winget-pkgs
          identifier: 'Microsoft.PowerShell'
          # PowerShell repo has regular releases
          repo: 'PowerShell/PowerShell'
          # URL with {VERSION} placeholder to test substitution
          url: 'https://github.com/PowerShell/PowerShell/releases/download/v{VERSION}/PowerShell-{VERSION}-win-x64.msi'

      - name: Assert FINAL_URL was set and contains a version (no placeholder remaining)
        run: |
          echo "FINAL_URL: $FINAL_URL"
          if [ -z "$FINAL_URL" ]; then
            echo "FAIL: FINAL_URL env var was not set"
            exit 1
          fi
          if echo "$FINAL_URL" | grep -q '{VERSION}'; then
            echo "FAIL: FINAL_URL still contains {VERSION} placeholder - substitution failed"
            exit 1
          fi
          if ! echo "$FINAL_URL" | grep -qE 'https://github.com/PowerShell/PowerShell/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/'; then
            echo "FAIL: FINAL_URL does not match expected pattern with a real version number"
            exit 1
          fi
          echo "PASS: FINAL_URL=$FINAL_URL"
