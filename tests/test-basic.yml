name: Test basic usage - valid package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: ${{ github.token }}
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: "https://update.code.visualstudio.com/{VERSION}/win32-x64-user/stable"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed (package exists check and release detection ran)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should succeed through the release detection step.
          # The Komac step has continue-on-error so it won't block.
          # We accept 'success' or 'failure' (if Komac fails with bad token),
          # but not a hard crash before the Komac step.
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
