name: Test basic usage - known package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: ${{ github.token }}
          identifier: Microsoft.PowerShell
          repo: PowerShell/PowerShell
          url: "https://github.com/PowerShell/PowerShell/releases/download/v{VERSION}/PowerShell-{VERSION}-win-x64.msi"

      - name: Assert action ran (package exists check and release detection passed)
        run: |
          # The action should have at least progressed past the package-existence check
          # and the release detection step. The Komac step has continue-on-error: true
          # so even if it fails (no real winget submit token), the job should not fail.
          # We verify the FINAL_URL env var was set by the Compose URL step.
          echo "FINAL_URL: $FINAL_URL"
          if [ -z "$FINAL_URL" ]; then
            echo "FAIL: FINAL_URL was not set — action did not reach the Compose URL step"
            exit 1
          fi
          if echo "$FINAL_URL" | grep -q "{VERSION}"; then
            echo "FAIL: FINAL_URL still contains {VERSION} placeholder — substitution failed"
            exit 1
          fi
          echo "PASS: FINAL_URL is set and version was substituted: $FINAL_URL"
