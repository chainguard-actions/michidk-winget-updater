name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: fake-token
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: https://github.com/microsoft/vscode/releases/download/v{VERSION}/VSCodeSetup-x64-{VERSION}.exe
          custom-fork-owner: my-custom-fork-owner
      - name: Assert action was invoked with custom-fork-owner
        run: |
          echo "Action was invoked with custom-fork-owner input set."
          echo "PASS: custom-fork-owner input is accepted by the action"
