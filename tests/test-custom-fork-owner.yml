name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with custom-fork-owner input
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.0.4'
          komac-token: ${{ github.token }}
          identifier: 'Microsoft.VisualStudioCode'
          repo: 'microsoft/vscode'
          url: 'https://update.code.visualstudio.com/{VERSION}/win32-x64-user/stable'
          custom-fork-owner: 'test-fork-owner'

      - name: Assert action ran with custom-fork-owner
        run: |
          echo "Action completed (with or without error due to Komac submission)"
          echo "The custom-fork-owner input was accepted and passed through"
          echo "PASS: custom-fork-owner input is accepted by the action"
