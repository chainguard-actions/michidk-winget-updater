name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: 'latest'
          komac-token: ${{ github.token }}
          identifier: 'Microsoft.VisualStudioCode'
          repo: 'microsoft/vscode'
          url: 'https://update.code.visualstudio.com/{VERSION}/win32-x64-user/stable'
          custom-fork-owner: 'test-fork-owner'

      - name: Assert action ran with custom-fork-owner
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the Komac submission step
          # (no real fork, sentinel repo, etc.) but it must have started
          # and processed the custom-fork-owner input.
          # Both success and failure are acceptable outcomes here;
          # what matters is that the action ran (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom-fork-owner input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may not have run"
            exit 1
          fi
