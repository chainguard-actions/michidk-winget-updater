name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: fake-token-for-testing
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: "https://github.com/microsoft/vscode/releases/download/{VERSION}/VSCodeSetup-x64-{VERSION}.exe"
          custom-fork-owner: my-custom-fork-owner
      - name: Assert action ran with custom-fork-owner
        run: |
          echo "Action completed (with or without error — custom-fork-owner input was exercised)"
          echo "PASS"
