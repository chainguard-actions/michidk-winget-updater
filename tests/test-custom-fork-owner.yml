name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom-fork-owner input
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: ${{ github.token }}
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: "https://github.com/microsoft/vscode/releases/download/v{VERSION}/VSCodeSetup-x64-{VERSION}.exe"
          version: "1.85.0"
          custom-fork-owner: "test-fork-owner"

      - name: Assert action ran with custom-fork-owner input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the Komac/submit step since we don't
          # have a real winget-pkgs submission token. What matters is that the
          # custom-fork-owner input was accepted and the action progressed past
          # input validation (it will fail at Komac, not at input parsing).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom-fork-owner input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
