name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater with custom-fork-owner
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: latest
          komac-token: ${{ github.token }}
          identifier: Microsoft.VisualStudioCode
          repo: microsoft/vscode
          url: "https://update.code.visualstudio.com/{VERSION}/win32-x64-user/stable"
          custom-fork-owner: test-fork-owner

      - name: Assert action ran (package check and release detection should succeed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action's Komac step has continue-on-error: true, so the composite
          # action itself should succeed even if Komac submission fails.
          # The package exists in winget-pkgs and the repo has releases, so
          # the first two steps should pass. The Komac step may fail but is
          # covered by continue-on-error in the action definition.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom-fork-owner"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
