name: Test custom-fork-owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with custom-fork-owner input
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: 'latest'
          komac-token: 'fake-token-for-test'
          identifier: 'Microsoft.VisualStudioCode'
          repo: 'microsoft/vscode'
          url: 'https://example.com/{VERSION}/download'
          custom-fork-owner: 'my-custom-fork-owner'
      - name: Assert custom-fork-owner input was accepted
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "The custom-fork-owner input was passed to the action successfully"
          echo "PASS: custom-fork-owner input is accepted by the action"
