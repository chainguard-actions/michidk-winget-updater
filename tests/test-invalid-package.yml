name: Test invalid package identifier - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action with non-existent package
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.0.4'
          komac-token: ${{ github.token }}
          identifier: 'ThisPackage.DoesNotExistInWinget99999'
          repo: 'microsoft/vscode'
          url: 'https://example.com/{VERSION}/installer.exe'

      - name: Assert action failed for non-existent package
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent package, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent package"
