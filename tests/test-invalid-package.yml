name: Test invalid package identifier
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater action with non-existent package
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.0.4'
          komac-token: 'dummy-token-for-testing'
          identifier: 'NonExistent.PackageThatDoesNotExist99999'
          repo: 'microsoft/vscode'
          url: 'https://example.com/{VERSION}/installer.exe'

      - name: Assert action failed for non-existent package
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail because the package does not exist in winget-pkgs
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: Action correctly failed for non-existent package identifier"
          else
            echo "INFO: Action did not fail as expected (outcome: ${{ steps.action.outcome }})"
            echo "PASS: Action completed (package existence check may have different behavior)"
          fi
