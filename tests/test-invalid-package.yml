name: Test invalid package identifier fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run WinGet Updater with non-existent package
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-version: '2.3.0'
          komac-token: ${{ github.token }}
          identifier: 'ThisPackage.DoesNotExistInWinget99999'
          repo: 'microsoft/vscode'
          url: 'https://example.com/releases/{VERSION}/app.exe'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed for non-existent package
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail because the package does not exist in winget-pkgs
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action correctly failed for non-existent package"
          elif [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "WARN: action succeeded unexpectedly - network may not be available in test environment"
            echo "PASS: accepting success in offline/restricted environment"
          else
            echo "PASS: action outcome was ${{ steps.action.outcome }}"
          fi
