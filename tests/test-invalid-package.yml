name: Test invalid package identifier
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent package (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          komac-token: ${{ github.token }}
          identifier: "ThisPackage.DoesNotExistAtAll.XYZ123"
          repo: "actions/checkout"
          url: "https://example.com/download/{VERSION}/app.exe"
          version: "1.0.0"

      - name: Assert action failed for non-existent package
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent package, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent package"
